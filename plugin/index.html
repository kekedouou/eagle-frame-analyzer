<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>视频分析</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="workspace">
    <section class="player-pane" aria-label="视频播放器">
      <div class="screen">
        <canvas id="picture" width="1280" height="720" aria-label="当前视频画面"></canvas>
        <div id="notice" class="notice" role="status">在 Eagle 中单选 MP4 后打开插件</div>
      </div>
      <div class="transport">
        <div class="timeline-area">
          <div id="timeline" class="timeline" role="slider" tabindex="0" aria-label="视频进度"
            aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-disabled="true">
            <div class="rail"><div id="progress" class="progress"></div></div>
            <span id="thumb" class="thumb"></span>
            <output id="timeHint" class="time-hint" hidden>0:00.000</output>
          </div>
          <div id="commentMarkers" class="comment-markers" aria-label="时间点标注"></div>
        </div>
        <div class="controls">
          <button id="play" type="button" title="播放 / 暂停（空格）" disabled>播放</button>
          <button id="previous" type="button" title="上一帧（【 / [）" disabled>上一帧</button>
          <button id="next" type="button" title="下一帧（】 / ]）" disabled>下一帧</button>
          <span class="time-readout"><output id="frameReadout" class="frame-readout">帧：—</output><span><output id="currentTime">0:00.000</output><span class="muted"> / </span><output id="duration">0:00.000</output></span></span>
        </div>
      </div>
    </section>
    <aside class="sidebar" aria-label="素材信息">
      <h1>素材</h1>
      <p id="sourceName" class="source-name">未载入视频</p>
      <p class="preview-quality">720p 预览</p>
      <p id="memoryUsage" class="muted" title="当前视频由播放器管理的JPEG、解码图像、音频与在途预留；不包含浏览器、GPU或FFmpeg额外占用。">视频缓存 RAM：—</p>
      <details class="memory-settings">
        <summary>内存设置</summary>
        <label for="memoryMiB">视频缓存内存上限</label>
        <div class="memory-controls"><select id="memoryMiB" aria-label="视频缓存内存上限" disabled>
          <option value="512">512 MB</option><option value="1024">1 GB</option><option value="2048">2 GB</option>
          <option value="3072">3 GB</option><option value="4096">4 GB</option><option value="5120">5 GB</option>
          <option value="6144">6 GB</option><option value="7168">7 GB</option><option value="8192">8 GB</option>
          <option value="9216">9 GB</option><option value="10240">10 GB</option>
        </select><button id="memoryApply" type="button" disabled>应用</button></div>
        <p id="memoryAllowance" class="muted"></p>
        <p id="memoryStatus" class="muted" role="status"></p>
      </details>
      <details class="memory-settings">
        <summary>缓存管理</summary>
        <p class="muted">1天未使用的缓存在下次载入时清理；磁盘上限5GB。</p>
        <button id="cacheClearOther" type="button" disabled>清除其他视频缓存</button>
        <p id="cacheClearStatus" class="muted" role="status"></p>
      </details>
      <p id="status" class="status" role="status">等待素材</p>
      <p id="error" class="error" role="alert" hidden></p>
      <button id="retry" type="button" hidden>重试</button>
      <section class="comments" aria-label="视频标注">
        <div class="comment-heading"><h2>标注</h2><button id="commentAdd" type="button" disabled>添加</button></div>
        <p id="commentStatus" class="muted" role="status"></p>
        <div id="commentEditor" hidden>
          <p id="commentTime" class="muted"></p>
          <label for="commentText" class="muted">文字</label>
          <textarea id="commentText" rows="3" placeholder="记录当前画面的观察"></textarea>
          <div class="comment-actions"><button id="commentSave" type="button">保存</button><button id="commentCancel" type="button">取消</button></div>
        </div>
        <div id="commentList" class="comment-list"></div>
      </section>
    </aside>
  </main>
  <script src="player.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
