<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T0 核心风险验证</title>
  <style>
    body { margin: 16px; background: #ededed; color: #222; font: 14px/1.5 system-ui, sans-serif; }
    h1 { font-size: 19px; margin: 0; } p { margin: 7px 0; }
    .row { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; margin: 9px 0; }
    button, select, input { font: inherit; } button { padding: 4px 9px; }
    canvas { display: block; width: 100%; max-height: 400px; aspect-ratio: 16/9; object-fit: contain; background: #111; }
    #timeline { width: 100%; } #error { color: #ae1818; white-space: pre-wrap; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 150px; overflow: auto; background: white; padding: 9px; }
    .note { color: #555; font-size: 13px; }
  </style>
</head>
<body>
  <h1>T0：播放核心、逐帧与性能验证</h1>
  <p class="note">这是独立测试页面，正式播放器不会有这些测试按钮。仅使用已登记的四段素材；不写 Eagle 标注，不修改原视频。</p>
  <div class="row"><select id="sample" aria-label="测试素材" disabled></select><button id="reload" disabled>重新载入</button><button id="cancel" disabled>停止当前测试</button><strong id="status">等待 Eagle 初始化</strong></div>
  <p id="error" role="alert"></p>
  <canvas id="picture" width="1280" height="720"></canvas>
  <input id="timeline" type="range" min="0" max="1" step="any" value="0" aria-label="视频时间轴" disabled>
  <div class="row"><button id="previous" disabled>上一帧</button><button id="play" disabled>播放</button><button id="pause" disabled>暂停</button><button id="next" disabled>下一帧</button><output id="position">尚未就绪</output></div>
  <div class="row"><button id="accuracy" disabled>核对三段编号帧</button><button id="preparation" disabled>首次准备／复用各3轮</button><button id="performance" disabled>运行性能协议（约5分钟）</button></div>
  <p class="note">性能协议含0／25／60ms人为慢解码和独立随机定位。请保持窗口前台，勿操作时间轴或切换应用。正常轮与压力轮分别统计；不自动填人工通过。</p>
  <div class="row"><label>显示器Hz <input id="refresh" type="number" min="1" max="500" value="60" style="width:60px"></label>
    <label>人工拖动 <select id="manualDrag"><option>未检查</option><option>跟手</option><option>明显延迟</option></select></label>
    <label>声画 <select id="manualSync"><option>未检查</option><option>相符</option><option>可见不同步</option><option>无声不适用</option></select></label>
    <label>释放／逐帧 <select id="manualFrames"><option>未检查</option><option>与目标相符</option><option>不相符</option></select></label>
    <button id="save" disabled>保存人工观察</button>
  </div>
  <pre id="details">结果将在这里显示。准备／定位超时会保存失败，不能作为通过。</pre>
  <script src="../../../plugin/player.js"></script>
  <script src="app.js"></script>
</body>
</html>
